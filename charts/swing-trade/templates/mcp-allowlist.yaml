{{- if .Values.mcpAllowlist.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "swing-trade.fullname" . }}-mcp-allowlist
  labels:
    {{- include "swing-trade.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "swing-trade.fullname" . }}-api-mcp
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-listed-sources
        action: Allow
        principal:
          clientCIDRs:
            {{- toYaml .Values.mcpAllowlist.cidrs | nindent 12 }}
{{- end }}
