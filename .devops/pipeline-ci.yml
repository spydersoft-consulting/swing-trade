## Build pipeline for swing-trade. Mirrors PitStop's pipeline-ci.yml: one atomic build that builds the solution and the React UI,
## runs the unit tests, publishes the api and web images and the combined swing-trade OCI chart from one build number, bumps
## swing-trade-helm-config (test), and runs the two Playwright suites (API and web) that gate the publish.
##
## TODO(owner), see docs/DECISIONS.md "Open items for the owner": the SonarCloud projects (keys below follow PitStop's
## naming and must exist before the first analysis), the container registry service connection, and the GitHub endpoint.
resources:
  repositories:
    - repository: templates
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/azure-devops-templates
    - repository: helmfileconfig
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/swing-trade-helm-config

trigger:
  tags:
    include:
      - "*"
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md

pr:
  branches:
    include:
      - main

# Composed from two stage templates (as in PitStop): the build/publish stages and the Playwright integration stage,
# which runs after Build. Composition (not `extends`) is what lets one pipeline pull in both.
stages:
  - template: pipelines/build-multi-container/v1.yml@templates
    parameters:
      vmImage: ubuntu-latest
      gitVersionSpec: "6.0.x"
      netCoreVersion: "10.0.x"
      externalFeedCredentials: SpydersoftGithub
      nugetConfigPath: "$(Build.SourcesDirectory)/src/nuget.config"

      buildProject: Spydersoft.SwingTrade.slnx

      publishProjects:
        - name: api
          project: src/api/src/Spydersoft.SwingTrade.Api/Spydersoft.SwingTrade.Api.csproj
          artifactName: swingTradeApi
        - name: web
          project: src/web/src/Spydersoft.SwingTrade.Frontend/Spydersoft.SwingTrade.Frontend.csproj
          artifactName: swingTradeWeb

      executeTests: true
      testProjects: "**/*.UnitTests/*.csproj"
      testRunner: mtp

      # TODO(owner): create (or confirm) the SonarCloud project with this key; it must exist before executeSonar runs.
      sonarProjectKey: spydersoft-consulting_swing-trade
      sonarProjectName: swing-trade
      useSonarCloud: true
      sonarCloudOrganization: spydersoft-consulting
      sonarEndpointName: sonarcloud-spydersoft
      sonarExtraProperties: |
        sonar.exclusions=**/Migrations/**/*
        sonar.scanner.scanAll=false
        sonar.coverage.exclusions=**/Program.cs

      # The React UI (a yarn workspace member, like PitStop's). The UI has its own SonarCloud project (key in src/web/react-sonar-project.properties).
      uiEnabled: true
      uiSourceDirectory: src/web/src/swing-trade-ui
      uiNodeVersion: "24.x"
      uiUseYarn2: true
      uiCodeCoverageFile: src/web/src/swing-trade-ui/output/coverage/cobertura-coverage.xml
      uiUnitTestFile: src/web/src/swing-trade-ui/output/test/junit.xml
      uiSonarEndpointName: sonarcloud-spydersoft
      uiUseSonarCloud: true
      uiSonarCloudOrganization: spydersoft-consulting
      uiSonarConfigFile: src/web/react-sonar-project.properties

      # TODO(owner): containerRegistryName is the Azure DevOps Docker registry service connection PitStop uses (ghcr.io).
      containerRegistryName: github-spydersoft-docker
      dockerImages:
        - name: api
          dockerImageName: spydersoft-consulting/swing-trade-api
          dockerFilePath: src/api/src/Spydersoft.SwingTrade.Api/Dockerfile
          artifactName: swingTradeApi
          artifactZipName: Spydersoft.SwingTrade.Api
        - name: web
          dockerImageName: spydersoft-consulting/swing-trade-web
          dockerFilePath: src/web/Dockerfile
          artifactName: swingTradeWeb
          artifactZipName: Spydersoft.SwingTrade.Frontend

      helmCharts:
        - name: swing-trade
          chartPath: charts/swing-trade

      helmfileRepoName: helmfileconfig

      # Serial chain: Build -> integration_tests -> docker_publish/chart_publish -> updateHelmConfig.
      # Images and the chart (and therefore the helm/deploy bump) only happen if the Playwright suites pass.
      dockerPublishDependsOn:
        - integration_tests
      chartPublishDependsOn:
        - integration_tests
      updateHelmConfigDependsOn:
        - docker_publish
        - chart_publish

      # Three build shapes (same as PitStop):
      #  - PR: build/test/sonar only, no publish, no helm-config update.
      #  - main: beta build (GitVersion tags X.Y.Z-beta.<n> per GitVersion.yml) -> publish images+chart, update
      #    swing-trade-helm-config's test environment.
      #  - anything else (a tag push): release build (unlabeled X.Y.Z) -> publish, also update test; the deploy pipeline in
      #    swing-trade-helm-config promotes an unlabeled release to production. No Sonar re-analysis.
      ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        updateHelmConfig: false
        buildAndPublishDockerImages: false
        buildAndPublishHelmCharts: false
        executeSonar: true
        uiExecuteSonar: true
      ${{ elseif eq(variables['Build.SourceBranchName'], 'main') }}:
        updateHelmConfig: true
        buildAndPublishDockerImages: true
        buildAndPublishHelmCharts: true
        executeSonar: true
        uiExecuteSonar: true
      ${{ else }}:
        updateHelmConfig: true
        buildAndPublishDockerImages: true
        buildAndPublishHelmCharts: true
        executeSonar: false
        uiExecuteSonar: false

      helmTagsCollection: "api=$(build.buildnumber),web=$(build.buildnumber),chart_version=$(build.buildnumber)"

  # Playwright suites under src/api/tests and src/web/tests. docker_publish and chart_publish are pointed at this stage (above).
  # Each suite boots the Aspire AppHost Testing profile itself
  # through Playwright's webServer (Postgres, mock OIDC, WireMock for Alpaca/Tiingo, the API and the web BFF). That needs .NET 10 and a
  # container runtime on the agent; ubuntu-latest hosted images ship Docker, which is all the AppHost needs
  # (podman is a local-development substitution: ASPIRE_CONTAINER_RUNTIME=podman).
  - template: stages/integration-tests/v1.yml@templates
    parameters:
      vmImage: ubuntu-latest
      stageName: integration_tests
      dependsOn:
        - Build
      netCoreVersion: "10.0.x"
      nodeVersion: "24.x"
      externalFeedCredentials: SpydersoftGithub
      setupSteps:
        # UseNode@1 mis-resolves "24.x" to a stale cached Node on ubuntu-latest, which breaks corepack. Force the PATH
        # back to Node 24.x with NodeTool@0 (same workaround as PitStop's pipeline).
        - task: NodeTool@0
          displayName: "Force Node 24.x (UseNode@1 workaround)"
          inputs:
            versionSpec: "24.x"

        # The AppHost builds the web BFF project, whose MSBuild targets run `yarn install` and `yarn build` for the UI,
        # so the workspace dependencies (swing-trade-ui is a yarn workspace member) are installed first.
        - task: Bash@3
          displayName: "swing-trade-ui: yarn install"
          inputs:
            targetType: inline
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              set -euo pipefail
              corepack enable
              yarn install --immutable
      suites:
        - name: "API Integration"
          workingDirectory: src/api/tests/api-integration
          installCommand: "corepack enable && yarn install --immutable"
          # The API suite uses Playwright's request context: no browser needed.
          installBrowsers: false
        - name: "Web Integration"
          workingDirectory: src/web/tests/web-integration
          installCommand: "corepack enable && yarn install --immutable"
          # The web suite drives a real browser (Chromium) through the mock OIDC sign-in.
